<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="La Albacora">
  <!-- Marco en arco -->
  <path d="M7 61V28a25 25 0 0 1 50 0v33z" fill="#FFF6E3" stroke="#0E3B5C" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M11.5 61V28.5a20.5 20.5 0 0 1 41 0V61" fill="none" stroke="#F7B731" stroke-width="1.6"/>
  <!-- Albacora, vista de lado (cabeza a la derecha) -->
  <g transform="translate(32 33) scale(.94) translate(-32 -31)">
    <g fill="#0E3B5C">
      <!-- cola en media luna -->
      <path d="M20.6 29.4C20 25.8 16.8 22 12.6 20c1.8 3.4 2.9 7 3.1 11-.2 4-1.3 7.6-3.1 11 4.2-2 7.4-5.8 8-9.4z"/>
      <!-- aleta dorsal 1 -->
      <path d="M37.6 22.6c-1.6-3.4-3.8-6-6.8-7.8.6 2.9.6 5.6-.4 8.4z"/>
      <!-- aleta dorsal 2 y anal -->
      <path d="M27 24.9c-1-2.6-2.6-4.6-4.4-5.6.6 2.2.6 4.4 0 7.2zM27 37.1c-1 2.6-2.6 4.6-4.4 5.6.6-2.2.6-4.4 0-7.2z"/>
      <!-- cuerpo fusiforme -->
      <path d="M52.6 31c-3-5.6-9.4-9-17.4-9-7.2 0-12.8 3.9-16.4 7.6v2.8c3.6 3.7 9.2 7.6 16.4 7.6 8 0 14.4-3.4 17.4-9z"/>
    </g>
    <!-- pínulas -->
    <path d="M24.2 26.6l-1.6-.9.3 1.7zM21.9 28.2l-1.5-.8.3 1.5zM24.2 35.4l-1.6.9.3-1.7zM21.9 33.8l-1.5.8.3-1.5z" fill="#F7B731"/>
    <!-- aleta pectoral -->
    <path d="M41.8 30.6l-7.4 4.6 7.2-1.6z" fill="#F7B731" stroke="#F7B731" stroke-width=".6" stroke-linejoin="round"/>
    <!-- opérculo y ojo -->
    <path d="M43.6 25.2c1.7 3.7 1.7 7.9 0 11.6" fill="none" stroke="#FFF6E3" stroke-width="1.1" stroke-linecap="round" opacity=".75"/>
    <circle cx="47.2" cy="29.2" r="1.6" fill="#FFF6E3"/>
  </g>
  <!-- Línea de ola -->
  <path d="M12.5 53c2.4-2.8 4.8-2.8 7.2 0s4.8 2.8 7.2 0 4.8-2.8 7.2 0 4.8 2.8 7.2 0 4.8-2.8 7.2 0" fill="none" stroke="#F7B731" stroke-width="3" stroke-linecap="round"/>
</svg>
